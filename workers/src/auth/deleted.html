<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style type="text/css">
        body { margin: 0; padding: 0; background-color: #F4F7FA; -webkit-font-smoothing: antialiased; }
        table { border-collapse: collapse; }
        @media all and (max-width:639px) {
            .container { width: 100% !important; min-width: 100% !important; }
            .content-pad { padding-left: 20px !important; padding-right: 20px !important; }
        }
    </style>
</head>
<body style="margin: 0; padding: 0; background-color: #F4F7FA;">
<table width="100%" align="center" cellspacing="0" cellpadding="0" border="0">
  <tr>
    <td align="center" valign="top" style="padding: 0 8px; background-color: #F4F7FA;">
      <!-- Header -->
      <table width="640" align="center" border="0" cellpadding="0" cellspacing="0" style="max-width: 640px;">
        <tr>
          <td align="center" style="background-color: #2A2438; border-radius: 8px 8px 0 0; padding: 32px 50px 20px;">
            <img src="https://www.lxpavilion.top/bg/1.jpg" alt="LXPavilion" style="max-width: 120px; height: auto; display: block; margin: 0 auto 16px; border-radius: 8px;">
            <h1 style="font-family: 'Merriweather', serif; color: #FFFFFF; font-size: 22px; line-height: 1.3; font-weight: normal; margin: 0; text-align: center;">账号已注销</h1>
          </td>
        </tr>
      </table>
      <!-- Body -->
      <table width="640" align="center" border="0" cellpadding="0" cellspacing="0" style="max-width: 640px; background-color: #FFFFFF;">
        <tr>
          <td class="content-pad" style="padding: 40px 50px;">
            <p style="font-family: 'Inter', sans-serif; color: #333333; font-size: 15px; line-height: 1.6; margin: 0 0 24px;">你好 <strong>{{USERNAME}}</strong>，</p>
            <p style="font-family: 'Inter', sans-serif; color: #333333; font-size: 15px; line-height: 1.6; margin: 0 0 24px;">你的栏轩阁账号「{{USERNAME}}」已成功注销。</p>
            <p style="font-family: 'Inter', sans-serif; color: #999999; font-size: 13px; line-height: 1.6; margin: 0;">如果你改变主意，欢迎随时重新注册。</p>
          </td>
        </tr>
      </table>
      <!-- Footer -->
      <table width="640" align="center" border="0" cellpadding="0" cellspacing="0" style="max-width: 640px; background-color: #8B5CF6; border-radius: 0 0 8px 8px;">
        <tr>
          <td style="padding: 20px 50px; text-align: center;">
            <p style="font-family: 'Inter', sans-serif; color: #ffffff; font-size: 12px; margin: 0;">栏轩·阁</p>
            <p style="font-family: 'Inter', sans-serif; color: #ffffff; font-size: 12px; margin: 8px 0 0;">
              <a href="https://www.lxpavilion.top" target="_blank" style="color: #ffffff; text-decoration: underline;">博客主页</a>
            </p>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
