<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style type="text/css">
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      background-color: #F4F7FA;
      -webkit-font-smoothing: antialiased;
    }

    table {
      border-collapse: collapse;
    }

    table,
    td {
      mso-table-lspace: 0pt;
      mso-table-rspace: 0pt;
    }

    h1,
    h2,
    h3,
    p {
      margin: 0;
      word-break: break-word;
    }

    @media all and (max-width:639px) {
      .container {
        width: 100% !important;
        min-width: 100% !important;
      }

      .content-pad {
        padding-left: 20px !important;
        padding-right: 20px !important;
      }

      .info-row td {
        display: block !important;
        width: 100% !important;
        padding: 10px 0 !important;
      }

      .info-divider {
        display: none !important;
      }
    }
  </style>
</head>

<body style="margin: 0; padding: 0; background-color: #F4F7FA;">

  <table width="100%" align="center" cellspacing="0" cellpadding="0" border="0">
    <tr>
      <td align="center" valign="top" style="padding: 24px 8px 40px; background-color: #F4F7FA;">

        <!-- 主卡片容器：Header + Body + Footer 合为一体 -->
        <table width="640" align="center" border="0" cellpadding="0" cellspacing="0"
          style="max-width: 640px; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 12px rgba(0,0,0,0.08);">

          <!-- Header -->
          <tr>
            <td align="center" style="background-color: #2A2438; padding: 36px 50px 28px;">
              <img src="https://www.lxpavilion.top/bg/1.jpg" alt="LXPavilion"
                style="max-width: 100px; height: auto; display: block; margin: 0 auto; border-radius: 50%;">
              <h1
                style="font-family: 'Merriweather', serif; color: #FFFFFF; font-size: 22px; line-height: 1.3; font-weight: normal; margin: 18px 0 6px; text-align: center;">
                {{TYPE}}</h1>
              <p
                style="font-family: 'Inter', sans-serif; color: #A0A0A0; font-size: 13px; margin: 0; text-align: center; letter-spacing: 0.5px;">
                用户系统实时通知</p>
            </td>
          </tr>

          <!-- Body -->
          <tr>
            <td class="content-pad" style="background-color: #2A2438; padding: 10px 50px 30px;">

              <!-- 信息列表容器 -->
              <table width="100%" cellpadding="0" cellspacing="0" border="0">

                <!-- 用户名 -->
                <tr>
                  <td style="padding: 18px 0 14px;">
                    <table width="100%" cellpadding="0" cellspacing="0" border="0">
                      <tr>
                        <td width="36" style="vertical-align: middle; padding-right: 14px;">
                          <span
                            style="display: inline-block; width: 36px; height: 36px; background-color: #3D3550; border-radius: 50%; text-align: center; line-height: 36px; font-size: 16px;">👤</span>
                        </td>
                        <td style="vertical-align: middle;">
                          <p
                            style="font-family: 'Inter', sans-serif; color: #A0A0A0; font-size: 11px; margin: 0 0 2px; letter-spacing: 1px; text-transform: uppercase;">
                            用户名</p>
                          <p
                            style="font-family: 'Inter', sans-serif; color: #FFFFFF; font-size: 18px; margin: 0; font-weight: 500;">
                            {{USERNAME}}</p>
                        </td>
                      </tr>
                    </table>
                    <!-- 分割线 -->
                    <div style="height: 1px; background-color: #3D3550; margin-top: 14px; border-radius: 1px;"></div>
                  </td>
                </tr>

                <!-- 邮箱 -->
                <tr>
                  <td style="padding: 14px 0;">
                    <table width="100%" cellpadding="0" cellspacing="0" border="0">
                      <tr>
                        <td width="36" style="vertical-align: middle; padding-right: 14px;">
                          <span
                            style="display: inline-block; width: 36px; height: 36px; background-color: #3D3550; border-radius: 50%; text-align: center; line-height: 36px; font-size: 16px;">✉️</span>
                        </td>
                        <td style="vertical-align: middle;">
                          <p
                            style="font-family: 'Inter', sans-serif; color: #A0A0A0; font-size: 11px; margin: 0 0 2px; letter-spacing: 1px; text-transform: uppercase;">
                            邮箱</p>
                          <p style="font-family: 'Inter', sans-serif; color: #FFFFFF; font-size: 16px; margin: 0;">
                            {{EMAIL}}</p>
                        </td>
                      </tr>
                    </table>
                    <!-- 分割线 -->
                    <div style="height: 1px; background-color: #3D3550; margin-top: 14px; border-radius: 1px;"></div>
                  </td>
                </tr>

                <!-- 时间 -->
                <tr>
                  <td style="padding: 14px 0 4px;">
                    <table width="100%" cellpadding="0" cellspacing="0" border="0">
                      <tr>
                        <td width="36" style="vertical-align: middle; padding-right: 14px;">
                          <span
                            style="display: inline-block; width: 36px; height: 36px; background-color: #3D3550; border-radius: 50%; text-align: center; line-height: 36px; font-size: 16px;">🕐</span>
                        </td>
                        <td style="vertical-align: middle;">
                          <p
                            style="font-family: 'Inter', sans-serif; color: #A0A0A0; font-size: 11px; margin: 0 0 2px; letter-spacing: 1px; text-transform: uppercase;">
                            时间</p>
                          <p style="font-family: 'Inter', sans-serif; color: #FFFFFF; font-size: 16px; margin: 0;">
                            {{TIME}}</p>
                        </td>
                      </tr>
                    </table>
                  </td>
                </tr>
              </table>
              <!-- /信息列表容器 -->

            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="background-color: #8B5CF6; padding: 22px 50px; text-align: center;">
              <p
                style="font-family: 'Inter', sans-serif; color: #ffffff; font-size: 13px; margin: 0; font-weight: 500; letter-spacing: 1px;">
                栏轩·阁</p>
              <p
                style="font-family: 'Inter', sans-serif; color: #ffffff; font-size: 12px; margin: 10px 0 0; opacity: 0.9;">
                <a href="https://www.lxpavilion.top" target="_blank"
                  style="color: #ffffff; text-decoration: none; border-bottom: 1px solid rgba(255,255,255,0.4); padding-bottom: 1px;">访问博客主页</a>
              </p>
            </td>
          </tr>
        </table>
        <!-- /主卡片容器 -->

      </td>
    </tr>
  </table>

</body>

</html>
