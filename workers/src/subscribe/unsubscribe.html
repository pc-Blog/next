<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=yes">
  <meta name="format-detection" content="telephone=no, date=no, address=no, email=no, url=no">
  <title>确认退订 — 栏轩·阁</title>
  <style>
    @import url("https://assets.mlcdn.com/fonts-v2.css?version=1782479");
    @media screen { body { font-family: 'Inter', sans-serif; } }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; }
    body {
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
      background: linear-gradient(135deg, #1a1a2e 0%, #2A2438 50%, #1a1a2e 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: linear-gradient(180deg, #322a4a 0%, #2A2438 100%);
      border-radius: 8px;
      padding: 40px 50px;
      max-width: 500px;
      width: 100%;
      border: 1px solid rgba(139, 92, 246, 0.15);
      box-shadow: 0 8px 40px rgba(0,0,0,0.3);
    }
    .card h1 {
      font-family: 'Merriweather', serif;
      color: #FFFFFF;
      font-size: 26px;
      font-weight: normal;
      margin-bottom: 10px;
    }
    .card p {
      color: #A0A0A0;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 6px;
    }
    .card .email {
      color: #C4B5FD;
      font-weight: 500;
    }
    .group-tag {
      display: inline-block;
      background: rgba(139, 92, 246, 0.2);
      color: #C4B5FD;
      padding: 2px 12px;
      border-radius: 10px;
      font-size: 13px;
      margin: 6px 0 16px;
    }
    .reason-list {
      margin: 16px 0 20px;
      background: rgba(0,0,0,0.2);
      border-radius: 6px;
      padding: 12px 16px;
      border: 1px solid rgba(139, 92, 246, 0.08);
    }
    .reason-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 0;
      color: #C0C0C0;
      font-size: 14px;
    }
    .reason-item input[type="checkbox"] {
      appearance: none;
      width: 16px;
      height: 16px;
      border: 2px solid #4A4A4A;
      border-radius: 3px;
      cursor: pointer;
      flex-shrink: 0;
    }
    .reason-item input[type="checkbox"]:checked {
      background: #8B5CF6;
      border-color: #8B5CF6;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 16 16' fill='white' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M12.207 4.793a1 1 0 010 1.414l-5 5a1 1 0 01-1.414 0l-2-2a1 1 0 011.414-1.414L6.5 9.086l4.293-4.293a1 1 0 011.414 0z'/%3E%3C/svg%3E");
      background-size: contain;
    }
    .btn-group {
      display: flex;
      gap: 12px;
      margin-top: 8px;
    }
    .btn {
      display: inline-block;
      padding: 14px 25px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      border: none;
      transition: opacity 0.2s;
      text-decoration: none;
      line-height: 1;
    }
    .btn-danger {
      background: #EF4444;
      color: #FFFFFF;
      flex: 1;
    }
    .btn-danger:hover { opacity: 0.9; }
    .btn-secondary {
      background: transparent;
      color: #A0A0A0;
      border: 1px solid #4A4A4A;
    }
    .btn-secondary:hover { color: #FFFFFF; border-color: #8B5CF6; }
    .success-icon {
      width: 56px; height: 56px; background: #10B981; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 20px; font-size: 28px; color: #FFFFFF;
    }
    .error-icon {
      width: 56px; height: 56px; background: #EF4444; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 20px; font-size: 28px; color: #FFFFFF;
    }
    .spinner { display: none; }
    .loading .spinner { display: inline-block; }
    .loading .btn-text { display: none; }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .spinner::after {
      content: '';
      display: inline-block;
      width: 14px; height: 14px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #FFFFFF;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      vertical-align: middle;
    }
    .footer-note {
      margin-top: 16px;
      font-size: 12px;
      color: #6B7280;
      text-align: center;
    }
    .feedback-input {
      width: 100%;
      padding: 12px 16px;
      border-radius: 6px;
      border: 1px solid #4A4A4A;
      background: rgba(0,0,0,0.2);
      color: #C0C0C0;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      line-height: 1.5;
      resize: vertical;
      min-height: 60px;
      margin-top: 4px;
      outline: none;
      transition: border-color 0.2s;
    }
    .feedback-input:focus {
      border-color: #8B5CF6;
    }
    .feedback-input::placeholder {
      color: #6B7280;
    }
    @media (max-width: 540px) {
      .card { padding: 30px 24px; }
      .btn-group { flex-direction: column; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div id="confirm-view" style="text-align: center;">
      <div style="font-size: 40px; margin-bottom: 8px;">📧</div>
      <h1>确认退订</h1>
      <p>确定要取消 <span class="email">{{EMAIL}}</span> 的订阅吗？</p>
      <span class="group-tag">{{GROUP_LABEL}}</span>

      <div class="reason-list" style="text-align: left;">
        <div style="color: #C4B5FD; font-size: 12px; margin-bottom: 4px;">退订原因（可选）</div>
        <label class="reason-item"><input type="checkbox" checked> 邮件太频繁</label>
        <label class="reason-item"><input type="checkbox"> 内容不再感兴趣</label>
        <label class="reason-item"><input type="checkbox"> 邮箱地址更换</label>
        <label class="reason-item"><input type="checkbox" checked> 暂时想静一静</label>
      </div>

      <textarea class="feedback-input" id="feedback-input" placeholder="其他意见或改进建议…（可选）"></textarea>

      <div class="btn-group">
        <button class="btn btn-danger" id="confirm-btn" onclick="unsubscribe()">
          <span class="btn-text">确认退订</span>
          <span class="spinner"></span>
        </button>
        <a href="https://www.lxpavilion.top" class="btn btn-secondary">返回博客</a>
      </div>
      <div class="footer-note">退订后将不再收到该类型的推送邮件</div>
    </div>

    <div id="success-view" style="display:none; text-align: center;">
      <div class="success-icon">✓</div>
      <h1>已退订</h1>
      <p><span class="email">{{EMAIL}}</span> 已成功取消</p>
      <span class="group-tag">{{GROUP_LABEL}}</span>
      <p style="font-size: 13px; color: #6B7280; margin-top: 16px;">随时可以回博客重新订阅</p>
      <div style="margin-top: 20px;">
        <a href="https://www.lxpavilion.top" class="btn btn-secondary">返回博客</a>
      </div>
    </div>

    <div id="error-view" style="display:none; text-align: center;">
      <div class="error-icon">✕</div>
      <h1>退订失败</h1>
      <p id="error-msg" style="color: #EF4444;">操作失败，请稍后重试</p>
      <div style="margin-top: 20px;">
        <a href="https://www.lxpavilion.top" class="btn btn-secondary">返回博客</a>
      </div>
    </div>
  </div>

  <script>
    async function unsubscribe() {
      const btn = document.getElementById('confirm-btn');
      btn.classList.add('loading');
      btn.disabled = true;
      try {
        const r = await fetch('/api/unsubscribe', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: {{EMAIL_JSON}}, group: {{GROUP_JSON}}, feedback: document.getElementById('feedback-input').value }),
        });
        const d = await r.json();
        if (d.code === 1) {
          document.getElementById('confirm-view').style.display = 'none';
          document.getElementById('success-view').style.display = 'block';
        } else {
          throw new Error(d.msg || '退订失败');
        }
      } catch (e) {
        document.getElementById('confirm-view').style.display = 'none';
        document.getElementById('error-view').style.display = 'block';
        document.getElementById('error-msg').textContent = e.message;
      }
    }
  </script>
</body>
</html>
